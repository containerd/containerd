syntax = "proto3";

package containerd.runtime.sandbox.v1;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "types/metrics.proto";
import "types/mount.proto";
import "types/platform.proto";
import "types/sandbox.proto";

option go_package = "github.com/containerd/containerd/api/runtime/sandbox/v1;sandbox";

// Sandbox is an optional interface that shim may implement to support sandboxes environments.
// A typical example of sandbox is microVM or pause container - an entity that groups containers and/or
// holds resources relevant for this group.
service Sandbox {
  // CreateSandbox will be called right after sandbox shim instance launched.
  // It is a good place to initialize sandbox environment.
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);

  // StartSandbox will start a previously created sandbox.
  rpc StartSandbox(StartSandboxRequest) returns (StartSandboxResponse);

  // Platform queries the platform the sandbox is going to run containers on.
  // containerd will use this to generate a proper OCI spec.
  rpc Platform(PlatformRequest) returns (PlatformResponse);

  // StopSandbox will stop existing sandbox instance
  rpc StopSandbox(StopSandboxRequest) returns (StopSandboxResponse);

  // WaitSandbox blocks until sandbox exits.
  rpc WaitSandbox(WaitSandboxRequest) returns (WaitSandboxResponse);

  // SandboxStatus will return current status of the running sandbox instance
  rpc SandboxStatus(SandboxStatusRequest) returns (SandboxStatusResponse);

  // PingSandbox is a lightweight API call to check whether sandbox alive.
  rpc PingSandbox(PingRequest) returns (PingResponse);

  // ShutdownSandbox must shutdown shim instance.
  rpc ShutdownSandbox(ShutdownSandboxRequest) returns (ShutdownSandboxResponse);

  // SandboxMetrics retrieves metrics about a sandbox instance.
  rpc SandboxMetrics(SandboxMetricsRequest) returns (SandboxMetricsResponse);

  // UpdateSandbox applies an update of the sandbox metadata object to a running
  // sandbox instance (for example a pod level resource resize).
  // Implementing this RPC is optional: a shim that does not support updates MUST
  // return a `github.com/containerd/errdefs.ErrNotImplemented` error (gRPC
  // `codes.Unimplemented`), which callers are expected to tolerate.
  rpc UpdateSandbox(UpdateSandboxRequest) returns (UpdateSandboxResponse);

  // CheckpointSandbox saves the state of a started sandbox and the selected
  // containers to a directory.
  // Implementing this RPC is optional. A shim that does not support
  // checkpoints returns `codes.Unimplemented`.
  rpc CheckpointSandbox(CheckpointSandboxRequest) returns (CheckpointSandboxResponse);

  // RestoreSandbox starts a created sandbox from a checkpoint, in place of
  // StartSandbox. The checkpoint can come from a different sandbox.
  // Implementing this RPC is optional. A shim that does not support
  // checkpoints returns `codes.Unimplemented`.
  rpc RestoreSandbox(RestoreSandboxRequest) returns (RestoreSandboxResponse);
}

message CreateSandboxRequest {
  string sandbox_id = 1;
  string bundle_path = 2;
  repeated containerd.types.Mount rootfs = 3;
  google.protobuf.Any options = 4;
  string netns_path = 5;
  map<string, string> annotations = 6;
}

message CreateSandboxResponse {}

message StartSandboxRequest {
  string sandbox_id = 1;
}

message StartSandboxResponse {
  uint32 pid = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Any spec = 3;
}

message PlatformRequest {
  string sandbox_id = 1;
}

message PlatformResponse {
  containerd.types.Platform platform = 1;
}

message StopSandboxRequest {
  string sandbox_id = 1;
  uint32 timeout_secs = 2;
}

message StopSandboxResponse {}

message UpdateSandboxRequest {
  string sandbox_id = 1;
  // Deprecated: not set by containerd, use `sandbox` instead.
  google.protobuf.Any resources = 2 [deprecated = true];
  // Deprecated: not set by containerd, use `sandbox` instead.
  map<string, string> annotations = 3 [deprecated = true];
  // Sandbox is the updated sandbox metadata object as stored by containerd,
  // including its labels, spec and extensions.
  containerd.types.Sandbox sandbox = 4;
  // Fields are the fieldpaths of `sandbox` that have been updated.
  // An empty list means the whole object should be considered updated.
  repeated string fields = 5;
}

message WaitSandboxRequest {
  string sandbox_id = 1;
}

message WaitSandboxResponse {
  uint32 exit_status = 1;
  google.protobuf.Timestamp exited_at = 2;
}

message UpdateSandboxResponse {}

message SandboxStatusRequest {
  string sandbox_id = 1;
  bool verbose = 2;
}

message SandboxStatusResponse {
  string sandbox_id = 1;
  uint32 pid = 2;
  string state = 3;
  map<string, string> info = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp exited_at = 6;
  google.protobuf.Any extra = 7;
}

message PingRequest {
  string sandbox_id = 1;
}

message PingResponse {}

message ShutdownSandboxRequest {
  string sandbox_id = 1;
}

message ShutdownSandboxResponse {}

message SandboxMetricsRequest {
  string sandbox_id = 1;
}

message SandboxMetricsResponse {
  containerd.types.Metric metrics = 1;
}

message CheckpointSandboxRequest {
  string sandbox_id = 1;
  // Path is an existing, empty local directory. The shim writes the
  // checkpoint to this directory and does not write outside it.
  string path = 2;
  // Containers are the containers to include in the checkpoint.
  repeated containerd.types.CheckpointSandboxContainer containers = 3;
  // Annotations are additional key-value options for the checkpoint.
  map<string, string> annotations = 4;
  // Extensions are optional features, keyed by a unique name.
  map<string, google.protobuf.Any> extensions = 5;
}

message CheckpointSandboxResponse {
  // Annotations are additional key-value data about the checkpoint.
  map<string, string> annotations = 1;
  // Extensions are optional feature data, keyed by a unique name.
  map<string, google.protobuf.Any> extensions = 2;
}

message RestoreSandboxRequest {
  string sandbox_id = 1;
  // Path is a directory that CheckpointSandbox wrote. The shim does not
  // change the files in this directory.
  string path = 2;
  // Containers are the containers to restore into the sandbox. Their names
  // must be the same set as the container names in the checkpoint. The
  // shim returns an error if a container does not agree with the
  // checkpoint.
  repeated containerd.types.RestoreSandboxContainer containers = 3;
  // Annotations are additional key-value options for the restore.
  map<string, string> annotations = 4;
  // Extensions are optional features, keyed by a unique name.
  map<string, google.protobuf.Any> extensions = 5;
}

message RestoreSandboxResponse {
  uint32 pid = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Any spec = 3;
  // Extensions are optional feature data, keyed by a unique name.
  map<string, google.protobuf.Any> extensions = 4;
}
