syntax = "proto3";

package containerd.types;

import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/containerd/containerd/api/types;types";

// Sandbox represents a sandbox metadata object that keeps all info required by controller to
// work with a particular instance.
message Sandbox {
  // SandboxID is a unique instance identifier within namespace
  string sandbox_id = 1;
  message Runtime {
    // Name is the name of the runtime.
    string name = 1;
    // Options specify additional runtime initialization options for the shim (this data will be available in StartShim).
    // Typically this data expected to be runtime shim implementation specific.
    google.protobuf.Any options = 2;
  }
  // Runtime specifies which runtime to use for executing this container.
  Runtime runtime = 2;
  // Spec is sandbox configuration (kin of OCI runtime spec), spec's data will be written to a config.json file in the
  // bundle directory (similary to OCI spec).
  google.protobuf.Any spec = 3;
  // Labels provides an area to include arbitrary data on containers.
  map<string, string> labels = 4;
  // CreatedAt is the time the container was first created.
  google.protobuf.Timestamp created_at = 5;
  // UpdatedAt is the last time the container was mutated.
  google.protobuf.Timestamp updated_at = 6;
  // Extensions allow clients to provide optional blobs that can be handled by runtime.
  map<string, google.protobuf.Any> extensions = 7;
  // Sandboxer is the name of the sandbox controller who manages the sandbox.
  string sandboxer = 10;
}

// CheckpointSandboxContainer selects a container to include in a checkpoint.
message CheckpointSandboxContainer {
  // ID is the ID of the container in the sandbox. It selects the container
  // to checkpoint. IDs are not kept across checkpoint and restore.
  string id = 1;
  // Name is the stable name of the container. The checkpoint records it,
  // and RestoreSandboxContainer.name must match it on restore.
  string name = 2;
}

// RestoreSandboxContainer maps a container in a checkpoint to a container
// in the restored sandbox.
message RestoreSandboxContainer {
  // ID is the ID of the container in the restored sandbox. It can be
  // different from the ID at checkpoint time.
  string id = 1;
  // Name is the stable name of the container. It must match the name of a
  // container in the checkpoint, which is how the container is matched.
  string name = 2;
  // Spec is the OCI runtime spec of the container in the restored sandbox.
  google.protobuf.Any spec = 3;
}
