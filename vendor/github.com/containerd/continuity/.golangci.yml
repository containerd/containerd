version: "2"

run:
  timeout: 3m

linters:
  enable:
    - misspell
    - revive
    - unconvert
  disable:
    - errcheck
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        text: "unused-parameter"

formatters:
  enable:
    - gofmt
    - goimports
