name: Release support

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    paths:
      - "releases/support.toml"
      - "cmd/gen-release-support/**"
      - ".github/workflows/release-support.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.repository == 'containerd/containerd'
    name: Check RELEASES.md is current for today's date
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/install-go

      - run: make check-release-support
